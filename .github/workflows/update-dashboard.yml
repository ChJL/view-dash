name: Update portfolio dashboard

on:
  schedule:
    # Times are UTC. Adjust to your timezone — use https://crontab.guru to check.
    # These three runs are roughly 08:00 / 13:00 / 21:30 US Eastern (pre-market,
    # midday, after close). Edit freely, or add/remove lines.
    - cron: '0 12 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '30 20 * * 1-5'
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-api-python-client cryptography

      - name: Fetch Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          VIEWDASH_SHEET_ID: ${{ secrets.VIEWDASH_SHEET_ID }}
          DASHBOARD_PASS: ${{ secrets.DASHBOARD_PASS }}
        run: python scripts/fetch_sheet.py

      - name: Commit updated data.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh portfolio data"
          file_pattern: data.json
